AWSTemplateFormatVersion: '2010-09-09'
Description: 'Account-wide CloudWatch Logs to OpenObserve — one AWS::Logs::AccountPolicy subscribes every current and future log group (except our own) to a shared Kinesis + Firehose pipeline.'

Parameters:
  OpenObserveEndpoint:
    Type: String
    Description: 'OpenObserve HTTP endpoint URL (e.g., https://api.openobserve.ai/api/your-org/default/_kinesis_firehose)'

  OpenObserveAccessKey:
    Type: String
    NoEcho: true
    Description: 'OpenObserve access key for authentication (base64 encoded user:password)'

  StreamName:
    Type: String
    Default: 'cloudwatch-logs-all'
    Description: 'Name for the OpenObserve stream that receives all account log events'

  ShardCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: 'Number of shards for the Kinesis Data Stream that fans records into Firehose. Bump for high-volume accounts.'

  BackupS3BucketName:
    Type: String
    Default: ''
    Description: 'OPTIONAL — name of an EXISTING S3 bucket for Firehose failed-records backup. Leave blank to have CFN create a fresh bucket (auto-generated unique name, AES256 encryption, 30-day expiration, all public access blocked). Provide a name to reuse an existing bucket you already manage — no create attempt.'

Conditions:
  CreateBackupBucket: !Equals [!Ref BackupS3BucketName, '']

Resources:
  # S3 bucket for records Firehose couldn't deliver (failed-only backup mode).
  # Only created when the user leaves BackupS3BucketName blank — otherwise
  # the passed-in bucket is used as-is (user is expected to own the encryption,
  # lifecycle, and IAM policy of a bucket they specified).
  BackupS3Bucket:
    Type: AWS::S3::Bucket
    Condition: CreateBackupBucket
    Properties:
      # No BucketName — CFN auto-generates one, guaranteeing global uniqueness
      # and eliminating BucketAlreadyOwnedByYou failures on redeploys.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldBackups
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Kinesis Data Stream: the CW Logs AccountPolicy subscription writes to this,
  # Firehose consumes from it.
  CloudWatchLogStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub '${AWS::StackName}-cwl-all'
      ShardCount: !Ref ShardCount
      RetentionPeriodHours: 24
      StreamModeDetails:
        StreamMode: PROVISIONED

  # Firehose does not auto-create the log group it writes delivery errors to.
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/${AWS::StackName}"
      RetentionInDays: 14

  # Pre-create the delivery-error log stream so the CloudWatch Logs console
  # can open it immediately at t=0 (Firehose otherwise creates it lazily).
  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: DeliveryStreamLogs

  # IAM Role for the Lambda transformer.
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: KinesisReadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'kinesis:GetRecords'
                  - 'kinesis:GetShardIterator'
                  - 'kinesis:DescribeStream'
                  - 'kinesis:ListStreams'
                  - 'kinesis:PutRecord'
                  - 'kinesis:PutRecords'
                Resource: !GetAtt CloudWatchLogStream.Arn

  # Transforms gzip-compressed CloudWatch Logs subscription payloads into
  # newline-delimited JSON records that OpenObserve indexes cleanly.
  LogTransformFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import base64
          import json
          import gzip
          from datetime import datetime

          def lambda_handler(event, context):
              output = []
              for record in event['records']:
                  payload = base64.b64decode(record['data'])
                  try:
                      log_data = json.loads(gzip.decompress(payload))
                      log_group = log_data.get('logGroup', '')
                      log_stream = log_data.get('logStream', '')
                      log_events = log_data.get('logEvents', [])
                      transformed = []
                      for e in log_events:
                          transformed.append({
                              'timestamp': e.get('timestamp', int(datetime.utcnow().timestamp() * 1000)),
                              'message': e.get('message', ''),
                              'logGroup': log_group,
                              'logStream': log_stream,
                              'id': e.get('id', ''),
                          })
                      output_data = '\n'.join(json.dumps(l) for l in transformed) + '\n'
                      output.append({
                          'recordId': record['recordId'],
                          'result': 'Ok',
                          'data': base64.b64encode(output_data.encode('utf-8')).decode('utf-8'),
                      })
                  except Exception as ex:
                      print(f"Error processing record: {ex}")
                      output.append({
                          'recordId': record['recordId'],
                          'result': 'ProcessingFailed',
                          'data': record['data'],
                      })
              return {'records': output}

  # IAM Role Firehose uses to read from Kinesis, invoke the Lambda transformer,
  # and PUT failed records to the backup S3 bucket.
  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: FirehoseDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:AbortMultipartUpload'
                  - 's3:GetBucketLocation'
                  - 's3:GetObject'
                  - 's3:ListBucket'
                  - 's3:ListBucketMultipartUploads'
                  - 's3:PutObject'
                Resource:
                  - !If [CreateBackupBucket, !GetAtt BackupS3Bucket.Arn, !Sub 'arn:aws:s3:::${BackupS3BucketName}']
                  - !If [CreateBackupBucket, !Sub '${BackupS3Bucket.Arn}/*', !Sub 'arn:aws:s3:::${BackupS3BucketName}/*']
              - Effect: Allow
                Action:
                  - 'kinesis:DescribeStream'
                  - 'kinesis:GetShardIterator'
                  - 'kinesis:GetRecords'
                  - 'kinesis:ListShards'
                Resource: !GetAtt CloudWatchLogStream.Arn
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                  - 'lambda:GetFunctionConfiguration'
                Resource: !GetAtt LogTransformFunction.Arn
              - Effect: Allow
                Action:
                  - 'logs:PutLogEvents'
                Resource: !GetAtt FirehoseLogGroup.Arn

  # Firehose delivery stream — reads from Kinesis, runs the Lambda transformer,
  # POSTs newline-delimited JSON to the OpenObserve HTTP endpoint.
  OpenObserveFirehose:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - FirehoseDeliveryRole
    Properties:
      DeliveryStreamType: KinesisStreamAsSource
      KinesisStreamSourceConfiguration:
        KinesisStreamARN: !GetAtt CloudWatchLogStream.Arn
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn
      HttpEndpointDestinationConfiguration:
        EndpointConfiguration:
          Url: !Ref OpenObserveEndpoint
          AccessKey: !Ref OpenObserveAccessKey
          Name: OpenObserve
        RequestConfiguration:
          ContentEncoding: GZIP
          CommonAttributes:
            - AttributeName: stream-name
              AttributeValue: !Ref StreamName
        BufferingHints:
          SizeInMBs: 1
          IntervalInSeconds: 60
        RetryOptions:
          DurationInSeconds: 300
        S3BackupMode: FailedDataOnly
        S3Configuration:
          BucketARN: !If [CreateBackupBucket, !GetAtt BackupS3Bucket.Arn, !Sub 'arn:aws:s3:::${BackupS3BucketName}']
          RoleARN: !GetAtt FirehoseDeliveryRole.Arn
          CompressionFormat: GZIP
          BufferingHints:
            SizeInMBs: 5
            IntervalInSeconds: 300
          Prefix: 'failed-logs/'
          ErrorOutputPrefix: 'error-logs/'
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt LogTransformFunction.Arn
                - ParameterName: RoleArn
                  ParameterValue: !GetAtt FirehoseDeliveryRole.Arn
                # AWS Lambda has a hard 6 MB synchronous-response cap. CW Logs
                # subscription payloads gunzip ~5-10x, and account-wide mode
                # can send a lot of data per invocation. Cap Firehose's input
                # per-invocation at 0.5 MB so the Lambda's transformed output
                # (newline-JSON + base64) stays under the 6 MB response limit
                # even at 10x expansion. Trade-off: more Lambda invocations.
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '0.5'
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream
        # Top-level RoleARN on HttpEndpointDestinationConfiguration is required
        # by the Firehose API when CloudWatchLoggingOptions is set — otherwise
        # the CreateDeliveryStream call fails with
        # "RoleArn must be provided when CloudWatchLoggingOptions exists".
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn

  # IAM Role CloudWatch Logs assumes when it writes subscription events into
  # our Kinesis stream. Also referenced by the AccountPolicy below.
  CloudWatchLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: CloudWatchLogsKinesisWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'kinesis:PutRecord'
                  - 'kinesis:PutRecords'
                Resource: !GetAtt CloudWatchLogStream.Arn

  # The single account-wide subscription — no fan-out, no enumeration.
  # SelectionCriteria excludes our own Firehose delivery-error log group to
  # prevent the infinite loop where Firehose delivery-error logs would flow
  # back through Firehose. Every OTHER current or future log group in this
  # region of this account is subscribed automatically.
  #
  # Grammar note: AWS's SelectionCriteria for SUBSCRIPTION_FILTER_POLICY only
  # supports `LogGroupName IN [...]` / `LogGroupName NOT IN [...]` with EXACT
  # log group names, not prefixes or wildcards. The Lambda transformer's
  # auto-created /aws/lambda/<gen-name> log group is not excluded — safe in
  # practice because the transformer only writes on unhandled exceptions, and
  # forwarding those doesn't create a loop (the transformer succeeds on the
  # re-processed JSON record).
  #
  # AWS hard limit: 1 SUBSCRIPTION_FILTER_POLICY per account per region.
  # If another tool (Datadog, Splunk, etc.) already deployed one, this create
  # will fail — nothing template-side can work around that.
  LogsAccountPolicy:
    Type: AWS::Logs::AccountPolicy
    DependsOn:
      - CloudWatchLogsRole
      - CloudWatchLogStream
      - FirehoseLogGroup
    Properties:
      PolicyName: !Sub '${AWS::StackName}-openobserve-all-logs'
      PolicyType: SUBSCRIPTION_FILTER_POLICY
      Scope: ALL
      SelectionCriteria: !Sub 'LogGroupName NOT IN ["/aws/kinesisfirehose/${AWS::StackName}"]'
      PolicyDocument: !Sub |
        {
          "DestinationArn": "${CloudWatchLogStream.Arn}",
          "RoleArn": "${CloudWatchLogsRole.Arn}",
          "FilterPattern": "",
          "Distribution": "Random"
        }

Outputs:
  KinesisStreamArn:
    Description: 'Kinesis Data Stream ARN'
    Value: !GetAtt CloudWatchLogStream.Arn

  FirehoseDeliveryStreamName:
    Description: 'Firehose Delivery Stream Name'
    Value: !Ref OpenObserveFirehose

  BackupS3BucketName:
    Description: 'S3 Bucket for Failed Records (auto-generated if the input param was blank; otherwise the user-provided name)'
    Value: !If [CreateBackupBucket, !Ref BackupS3Bucket, !Ref BackupS3BucketName]

  AccountPolicyName:
    Description: 'CloudWatch Logs Account Policy Name'
    Value: !Ref LogsAccountPolicy

  NextSteps:
    Description: 'Next Steps'
    Value: 'Every current and future CloudWatch Log Group in this region is now streaming to OpenObserve. Look in Streams for the stream name you set (default: cloudwatch-logs-all).'
