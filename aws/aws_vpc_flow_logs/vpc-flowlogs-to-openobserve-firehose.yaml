  HasVpc29:  !Not [!Equals [!Select [28, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
