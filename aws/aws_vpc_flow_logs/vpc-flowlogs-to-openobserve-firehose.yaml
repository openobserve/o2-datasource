  HasVpc32:  !Not [!Equals [!Select [31, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc33:  !Not [!Equals [!Select [32, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
