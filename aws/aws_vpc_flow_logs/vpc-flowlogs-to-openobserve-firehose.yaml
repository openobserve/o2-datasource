AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC Flow Logs to OpenObserve via Firehose (Direct - Recommended)'

Parameters:
  OpenObserveEndpoint:
    Type: String
    Description: 'OpenObserve HTTP endpoint URL (e.g., https://api.openobserve.ai/api/your-org/default/_kinesis)'

  OpenObserveAccessKey:
    Type: String
    NoEcho: true
    Description: 'OpenObserve access key for authentication (base64 encoded user:password)'

  StreamName:
    Type: String
    Default: 'vpc-flow-logs-stream'
    Description: 'Name for the OpenObserve stream'

  VpcIds:
    Type: String
    AllowedPattern: '^vpc-[0-9a-f]{8,17}(,vpc-[0-9a-f]{8,17}){0,49}$'
    ConstraintDescription: 'Between 1 and 50 VPC IDs, comma separated, no spaces (format: vpc-xxxxxxxx)'
    Description: 'VPC IDs to capture flow logs from. Up to 50, comma separated no spaces (e.g., vpc-abc123def456,vpc-abc123def457).'

  TrafficType:
    Type: String
    Default: 'ALL'
    AllowedValues:
      - ALL
      - ACCEPT
      - REJECT
    Description: 'Type of traffic to log (ALL, ACCEPT, or REJECT)'

  BackupS3BucketName:
    Type: String
    Default: ''
    Description: 'OPTIONAL — name of an EXISTING S3 bucket for Firehose failed-records backup. Leave blank to have CFN create a fresh bucket (auto-generated unique name, AES256 encryption, 30-day expiration, all public access blocked). Provide a name to reuse an existing bucket you already manage.'

Conditions:
  CreateBackupBucket: !Equals [!Ref BackupS3BucketName, '']
  # Pad VpcIds with 49 trailing commas, then split — !Select [i, ...]
  # returns "" for slots the user didn't fill. Slot 0 is always present
  # because AllowedPattern requires at least one entry.
  HasVpc2:   !Not [!Equals [!Select [1, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc3:   !Not [!Equals [!Select [2, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc4:   !Not [!Equals [!Select [3, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc5:   !Not [!Equals [!Select [4, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc6:   !Not [!Equals [!Select [5, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc7:   !Not [!Equals [!Select [6, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc8:   !Not [!Equals [!Select [7, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc9:   !Not [!Equals [!Select [8, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc10:  !Not [!Equals [!Select [9, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc11:  !Not [!Equals [!Select [10, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasVpc12:  !Not [!Equals [!Select [11, !Split [",", !Join [",", [!Ref VpcIds, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
