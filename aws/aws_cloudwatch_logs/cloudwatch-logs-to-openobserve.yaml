AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Logs to OpenObserve via Kinesis Data Streams and Firehose'

Parameters:
  OpenObserveEndpoint:
    Type: String
    Description: 'OpenObserve HTTP endpoint URL (e.g., https://api.openobserve.ai/api/your-org/default/_kinesis)'

  OpenObserveAccessKey:
    Type: String
    NoEcho: true
    Description: 'OpenObserve access key for authentication (base64 encoded user:password)'

  StreamName:
    Type: String
    Default: 'cloudwatch-logs-stream'
    Description: 'Name for the OpenObserve stream'

  LogGroupNames:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_./#-]+(,[A-Za-z0-9_./#-]+){0,49}$'
    ConstraintDescription: 'Between 1 and 50 log group names, comma separated, no spaces'
    Description: 'CloudWatch Log Group names to stream from. Up to 50, comma separated with no spaces (e.g., /aws/lambda/fn-a,/aws/lambda/fn-b).'

  ShardCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: 'Number of shards for Kinesis Data Stream'

  BackupS3BucketName:
    Type: String
    Default: ''
    Description: 'OPTIONAL — name of an EXISTING S3 bucket for Firehose failed-records backup. Leave blank to have CFN create a fresh bucket (auto-generated unique name, AES256 encryption, 30-day expiration, all public access blocked). Provide a name to reuse an existing bucket you already manage.'

  FilterPattern:
    Type: String
    Default: ''
    Description: 'CloudWatch Logs filter pattern (leave empty to stream all logs)'

Conditions:
  # If BackupS3BucketName is blank, create a fresh bucket (unique auto-generated
  # name); otherwise reference the user-provided existing bucket by ARN.
  CreateBackupBucket: !Equals [!Ref BackupS3BucketName, '']
  # Pad LogGroupNames with 49 trailing commas, then split — !Select [i, ...]
  # returns "" for slots the user didn't fill. Slot 0 is always present
  # because AllowedPattern requires at least one entry.
  HasLogGroup2:   !Not [!Equals [!Select [1, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup3:   !Not [!Equals [!Select [2, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup4:   !Not [!Equals [!Select [3, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup5:   !Not [!Equals [!Select [4, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup6:   !Not [!Equals [!Select [5, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup7:   !Not [!Equals [!Select [6, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup8:   !Not [!Equals [!Select [7, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup9:   !Not [!Equals [!Select [8, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup10:  !Not [!Equals [!Select [9, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup11:  !Not [!Equals [!Select [10, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup12:  !Not [!Equals [!Select [11, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
