Outputs:
  LogGroupNames:
    Description: 'CloudWatch Log Group Names being streamed (comma separated)'
    Value: !Ref LogGroupNames

  KinesisStreamName:
    Description: 'Kinesis Data Stream Name'
    Value: !Ref CloudWatchLogStream

  KinesisStreamArn:
    Description: 'Kinesis Data Stream ARN'
    Value: !GetAtt CloudWatchLogStream.Arn

  FirehoseDeliveryStreamName:
    Description: 'Firehose Delivery Stream Name'
    Value: !Ref OpenObserveFirehose

  BackupS3BucketName:
    Description: 'S3 Bucket for Failed Records (auto-generated if the input was blank; otherwise the user-provided name)'
    Value: !If [CreateBackupBucket, !Ref BackupS3Bucket, !Ref BackupS3BucketName]

  NextSteps:
    Description: 'Next Steps'
    Value: 'Logs from the specified CloudWatch Log Groups will now be streamed to OpenObserve automatically'
