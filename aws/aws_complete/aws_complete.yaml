AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Master template to deploy all OpenObserve AWS data source integrations as nested stacks.
  Enable each service by setting the corresponding Enable* parameter to 'true' and providing
  the required service-specific parameters. All individual templates must be uploaded to S3
  before deploying this master stack (use deploy.sh to automate this).

Parameters:

  # ============================================================
  # Template Storage
  # ============================================================
  TemplateS3Bucket:
    Type: String
    Default: 'openobserve-datasources-bucket'
    Description: 'S3 bucket name where all CloudFormation templates have been uploaded'

  TemplateS3Prefix:
    Type: String
    Default: 'datasource/cloud/aws'
    Description: 'S3 key prefix (folder) where templates are stored — no trailing slash'

  TemplateS3Region:
    Type: String
    Default: 'us-east-2'
    Description: 'AWS region where the TemplateS3Bucket lives (used to build nested stack TemplateURL). This is independent of the region where this master stack is being deployed.'

  # ============================================================
  # Common OpenObserve Configuration
  # ============================================================
  OpenObserveEndpoint:
    Type: String
    Description: 'OpenObserve HTTP endpoint URL (e.g., https://api.openobserve.ai/api/your-org/default/_kinesis)'

  OpenObserveAccessKey:
    Type: String
    NoEcho: true
    Description: 'OpenObserve access key for authentication (base64 encoded user:password)'

  OrganizationId:
    Type: String
    Default: 'default'
    Description: 'OpenObserve organization ID (informational / passthrough)'

  # ============================================================
  # Environment Configuration
  # ============================================================
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: 'Deployment environment'

  # ============================================================
  # Enable / Disable Services
  # ============================================================
  EnableApiGateway:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableCloudFront:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableCloudWatchLogs:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableCognito:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableDynamoDB:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableEC2:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableEventBridge:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableKinesisStream:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableRDS:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableRoute53:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableS3AccessLogs:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableVPCFlowLogs:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableALB:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableCloudTrail:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableCloudWatchMetrics:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableWAF:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  # ============================================================
  # Service-specific parameters (all optional with safe defaults)
  # ============================================================
  ApiGatewayId:
    Type: String
    Default: ''
  ApiGatewayStageName:
    Type: String
    Default: ''
  ApiGatewayBackupBucket:
    Type: String
    Default: ''
  ApiGatewayStreamName:
    Type: String
    Default: 'apigateway-logs-stream'
  ApiGatewayShardCount:
    Type: Number
    Default: 1

  CloudFrontDistributionId:
    Type: String
    Default: ''
  CloudFrontBackupBucket:
    Type: String
    Default: ''
  CloudFrontStreamName:
    Type: String
    Default: 'cloudfront_access_logs'
  CloudFrontShardCount:
    Type: Number
    Default: 1

  CloudWatchLogGroupName:
    Type: String
    Default: ''
  CloudWatchBackupBucket:
    Type: String
    Default: ''
  CloudWatchStreamName:
    Type: String
    Default: 'cloudwatch-logs-stream'
  CloudWatchShardCount:
    Type: Number
    Default: 1
  CloudWatchFilterPattern:
    Type: String
    Default: ''

  CognitoUserPoolId:
    Type: String
    Default: ''
  CognitoStreamName:
    Type: String
    Default: 'cognito-events-to-openobserve'

  DynamoDBTableName:
    Type: String
    Default: ''
  DynamoDBBackupBucket:
    Type: String
    Default: ''
  DynamoDBStreamName:
    Type: String
    Default: 'dynamodb-streams'
  DynamoDBShardCount:
    Type: Number
    Default: 1

  EC2TargetTagKey:
    Type: String
    Default: 'monitoring'
  EC2TargetTagValue:
    Type: String
    Default: 'enabled'
  EC2LogGroupPrefix:
    Type: String
    Default: '/aws/ec2/instances'

  EventBridgeRuleName:
    Type: String
    Default: ''
  EventBridgeEventPattern:
    Type: String
    Default: '{"source": ["aws.ec2"]}'
  EventBridgeBackupBucket:
    Type: String
    Default: ''
  EventBridgeStreamName:
    Type: String
    Default: 'eventbridge-events'

  KinesisStreamArn:
    Type: String
    Default: 'arn:aws:kinesis:us-east-1:000000000000:stream/placeholder'
  KinesisStreamName:
    Type: String
    Default: 'default/kinesis_logs'

  RDSLogGroupName:
    Type: String
    Default: ''
  RDSBackupBucket:
    Type: String
    Default: ''
  RDSStreamName:
    Type: String
    Default: 'rds-logs'
  RDSFilterPattern:
    Type: String
    Default: ''
  RDSInstanceIdentifier:
    Type: String
    Default: ''

  Route53HostedZoneId:
    Type: String
    Default: 'Z0PLACEHOLDER00000000'
  Route53BackupBucket:
    Type: String
    Default: ''
  Route53StreamName:
    Type: String
    Default: 'route53-query-logs'
  Route53ShardCount:
    Type: Number
    Default: 1

  S3SourceBucketName:
    Type: String
    Default: ''
  S3LogDestinationBucket:
    Type: String
    Default: ''
  S3AccessLogsBackupBucket:
    Type: String
    Default: ''
  S3StreamName:
    Type: String
    Default: 's3-access-logs-stream'
  S3LogPrefix:
    Type: String
    Default: 's3-access-logs/'

  VpcId:
    Type: String
    Default: ''
  VPCBackupBucket:
    Type: String
    Default: ''
  VPCStreamName:
    Type: String
    Default: 'vpc-flow-logs-stream'
  VPCTrafficType:
    Type: String
    Default: 'ALL'
    AllowedValues: ['ALL', 'ACCEPT', 'REJECT']

  ALBS3BucketName:
    Type: String
    Default: ''
  ALBAWSAccountId:
    Type: String
    Default: ''
  ALBELBAccountId:
    Type: String
    Default: ''
  ALBAccessLogsPrefix:
    Type: String
    Default: 'access-logs'
  ALBConnectionLogsPrefix:
    Type: String
    Default: 'connection-logs'
  ALBBasicAuthUsername:
    Type: String
    Default: ''
  ALBBasicAuthPassword:
    Type: String
    NoEcho: true
    Default: ''

  CloudTrailS3BucketName:
    Type: String
    Default: ''
  CloudTrailS3BackupBucket:
    Type: String
    Default: ''

  CloudWatchMetricsS3BackupBucket:
    Type: String
    Default: ''

  WAFS3BucketName:
    Type: String
    Default: ''
  WAFS3BackupBucket:
    Type: String
    Default: ''


Conditions:
  DeployApiGateway:        !Equals [!Ref EnableApiGateway, 'true']
  DeployCloudFront:        !Equals [!Ref EnableCloudFront, 'true']
  DeployCloudWatchLogs:    !Equals [!Ref EnableCloudWatchLogs, 'true']
  DeployCognito:           !Equals [!Ref EnableCognito, 'true']
  DeployDynamoDB:          !Equals [!Ref EnableDynamoDB, 'true']
  DeployEC2:               !Equals [!Ref EnableEC2, 'true']
  DeployEventBridge:       !Equals [!Ref EnableEventBridge, 'true']
  DeployKinesisStream:     !Equals [!Ref EnableKinesisStream, 'true']
  DeployRDS:               !Equals [!Ref EnableRDS, 'true']
  DeployRoute53:           !Equals [!Ref EnableRoute53, 'true']
  DeployS3AccessLogs:      !Equals [!Ref EnableS3AccessLogs, 'true']
  DeployVPCFlowLogs:       !Equals [!Ref EnableVPCFlowLogs, 'true']
  DeployALB:               !Equals [!Ref EnableALB, 'true']
  DeployCloudTrail:        !Equals [!Ref EnableCloudTrail, 'true']
  DeployCloudWatchMetrics: !Equals [!Ref EnableCloudWatchMetrics, 'true']
  DeployWAF:               !Equals [!Ref EnableWAF, 'true']


Resources:

  ApiGatewayStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployApiGateway
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_api_gateway_logs/apigateway-logs-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        ApiGatewayId: !Ref ApiGatewayId
        StageName: !Ref ApiGatewayStageName
        BackupS3BucketName: !Ref ApiGatewayBackupBucket
        StreamName: !Ref ApiGatewayStreamName
        ShardCount: !Ref ApiGatewayShardCount
        FilterPattern: ''
        EnableAccessLogging: 'false'
      TimeoutInMinutes: 30

  CloudFrontStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployCloudFront
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_cloudfront/cloudfront-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        CloudFrontDistributionId: !Ref CloudFrontDistributionId
        BackupS3BucketName: !Ref CloudFrontBackupBucket
        StreamName: !Ref CloudFrontStreamName
        ShardCount: !Ref CloudFrontShardCount
      TimeoutInMinutes: 30

  CloudWatchLogsStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployCloudWatchLogs
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_cloudwatch_logs/cloudwatch-logs-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        LogGroupName: !Ref CloudWatchLogGroupName
        BackupS3BucketName: !Ref CloudWatchBackupBucket
        StreamName: !Ref CloudWatchStreamName
        ShardCount: !Ref CloudWatchShardCount
        FilterPattern: !Ref CloudWatchFilterPattern
      TimeoutInMinutes: 30

  CognitoStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployCognito
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_cognito_logs/cognito-events-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        UserPoolId: !Ref CognitoUserPoolId
        StreamName: !Ref CognitoStreamName
        BackupS3Prefix: 'cognito-events-backup/'
      TimeoutInMinutes: 30

  DynamoDBStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployDynamoDB
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_dynamodb_logs/dynamodb-streams-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        DynamoDBTableName: !Ref DynamoDBTableName
        BackupS3BucketName: !Ref DynamoDBBackupBucket
        StreamName: !Ref DynamoDBStreamName
        ShardCount: !Ref DynamoDBShardCount
      TimeoutInMinutes: 30

  EC2Stack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployEC2
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_ec2_instance/ec2-cloudwatch-via-ssm.yaml'
      Parameters:
        TargetTagKey: !Ref EC2TargetTagKey
        TargetTagValue: !Ref EC2TargetTagValue
        LogGroupPrefix: !Ref EC2LogGroupPrefix
      TimeoutInMinutes: 30

  EventBridgeStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployEventBridge
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_eventbridge_events/eventbridge-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        RuleName: !Ref EventBridgeRuleName
        EventPattern: !Ref EventBridgeEventPattern
        BackupS3BucketName: !Ref EventBridgeBackupBucket
        StreamName: !Ref EventBridgeStreamName
      TimeoutInMinutes: 30

  KinesisStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployKinesisStream
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_kinesis_streams/kinesis-to-openobserve-firehose.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        KinesisStreamArn: !Ref KinesisStreamArn
        StreamName: !Ref KinesisStreamName
        EnableTransformation: 'false'
        BufferIntervalSeconds: 60
        BufferSizeMB: 5
      TimeoutInMinutes: 30

  RDSStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployRDS
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_rds_logs/rds-logs-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        LogGroupName: !Ref RDSLogGroupName
        BackupS3BucketName: !Ref RDSBackupBucket
        StreamName: !Ref RDSStreamName
        ShardCount: 1
        FilterPattern: !Ref RDSFilterPattern
        RDSInstanceIdentifier: !Ref RDSInstanceIdentifier
      TimeoutInMinutes: 30

  Route53Stack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployRoute53
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_route53_logs/route53-logs-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        HostedZoneId: !Ref Route53HostedZoneId
        BackupS3BucketName: !Ref Route53BackupBucket
        StreamName: !Ref Route53StreamName
        ShardCount: !Ref Route53ShardCount
      TimeoutInMinutes: 30

  S3AccessLogsStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployS3AccessLogs
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_s3_access_logs/s3-access-logs-to-openobserve.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        SourceBucketName: !Ref S3SourceBucketName
        LogDestinationBucketName: !Ref S3LogDestinationBucket
        BackupS3BucketName: !Ref S3AccessLogsBackupBucket
        StreamName: !Ref S3StreamName
        LogPrefix: !Ref S3LogPrefix
      TimeoutInMinutes: 30

  VPCFlowLogsStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployVPCFlowLogs
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_vpc_flow_logs/vpc-flowlogs-to-openobserve-firehose.yaml'
      Parameters:
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        OpenObserveAccessKey: !Ref OpenObserveAccessKey
        VpcId: !Ref VpcId
        BackupS3BucketName: !Ref VPCBackupBucket
        StreamName: !Ref VPCStreamName
        TrafficType: !Ref VPCTrafficType
      TimeoutInMinutes: 30

  ALBStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployALB
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/aws_alb/aws_alb.yaml'
      Parameters:
        S3BucketName: !Ref ALBS3BucketName
        AWSAccountId: !Ref ALBAWSAccountId
        ELBAccountId: !Ref ALBELBAccountId
        AccessLogsPrefix: !Ref ALBAccessLogsPrefix
        ConnectionLogsPrefix: !Ref ALBConnectionLogsPrefix
        OpenObserveEndpoint: !Ref OpenObserveEndpoint
        BasicAuthUsername: !Ref ALBBasicAuthUsername
        BasicAuthPassword: !Ref ALBBasicAuthPassword
      TimeoutInMinutes: 30

  CloudTrailStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployCloudTrail
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/cloudtrail_o2/cloudtrail_o2.yaml'
      Parameters:
        HttpEndpointName: 'OpenObserve-CloudTrail'
        HttpEndpointUrl: !Ref OpenObserveEndpoint
        AccessKey: !Ref OpenObserveAccessKey
        S3BucketCloudTrailName: !Ref CloudTrailS3BucketName
        S3BackupBucket: !Ref CloudTrailS3BackupBucket
      TimeoutInMinutes: 30

  CloudWatchMetricsStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployCloudWatchMetrics
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/CloudWatch_All_Metrics/CloudWatch_All_Metrics.yaml'
      Parameters:
        HttpEndpointName: 'OpenObserve-Metrics'
        HttpEndpointUrl: !Ref OpenObserveEndpoint
        AccessKey: !Ref OpenObserveAccessKey
        S3BackupBucket: !Ref CloudWatchMetricsS3BackupBucket
      TimeoutInMinutes: 30

  WAFStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployWAF
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/cloudformation_waf/cloudformation_waf.yaml'
      Parameters:
        HttpEndpointName: 'OpenObserve-WAF'
        HttpEndpointUrl: !Ref OpenObserveEndpoint
        AccessKey: !Ref OpenObserveAccessKey
        S3BucketWAFName: !Ref WAFS3BucketName
        S3BackupBucket: !Ref WAFS3BackupBucket
      TimeoutInMinutes: 30


Outputs:
  NestedTemplateBaseURL:
    Description: 'Base URL used to load nested stack templates from S3'
    Value: !Sub 'https://${TemplateS3Bucket}.s3.${TemplateS3Region}.amazonaws.com/${TemplateS3Prefix}/'

  DeployedServices:
    Description: 'Services enabled in this deployment'
    Value: !Join
      - ', '
      - - !If [DeployApiGateway,        'API Gateway',        !Ref AWS::NoValue]
        - !If [DeployCloudFront,        'CloudFront',         !Ref AWS::NoValue]
        - !If [DeployCloudWatchLogs,    'CloudWatch Logs',    !Ref AWS::NoValue]
        - !If [DeployCognito,           'Cognito',            !Ref AWS::NoValue]
        - !If [DeployDynamoDB,          'DynamoDB',           !Ref AWS::NoValue]
        - !If [DeployEC2,               'EC2',                !Ref AWS::NoValue]
        - !If [DeployEventBridge,       'EventBridge',        !Ref AWS::NoValue]
        - !If [DeployKinesisStream,     'Kinesis Stream',     !Ref AWS::NoValue]
        - !If [DeployRDS,               'RDS',                !Ref AWS::NoValue]
        - !If [DeployRoute53,           'Route53',            !Ref AWS::NoValue]
        - !If [DeployS3AccessLogs,      'S3 Access Logs',     !Ref AWS::NoValue]
        - !If [DeployVPCFlowLogs,       'VPC Flow Logs',      !Ref AWS::NoValue]
        - !If [DeployALB,               'ALB',                !Ref AWS::NoValue]
        - !If [DeployCloudTrail,        'CloudTrail',         !Ref AWS::NoValue]
        - !If [DeployCloudWatchMetrics, 'CloudWatch Metrics', !Ref AWS::NoValue]
        - !If [DeployWAF,               'WAF',                !Ref AWS::NoValue]
