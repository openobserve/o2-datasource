AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation stack for streaming CloudWatch Metrics to OpenObserve via Kinesis Firehose.

Parameters:
  HttpEndpointName:
    Type: String
    Description: Name of the HTTP endpoint for Kinesis Firehose.
  AccessKey:
    Type: String
    Description: Access key for authentication with the HTTP endpoint.
  HttpEndpointUrl:
    Type: String
    Description: 'OpenObserve HTTP endpoint URL for CloudWatch Metrics — must use the /aws/ path prefix and the fixed stream name cloudwatch_metrics (e.g., https://<host>/aws/<org>/cloudwatch_metrics/_kinesis_firehose). Different from the generic /api/ path used for logs services.'
  S3BackupBucket:
    Type: String
    Default: ''
    Description: 'OPTIONAL — name of an EXISTING S3 bucket for Firehose failed-records backup. Leave blank to have CFN create a fresh bucket (auto-generated unique name, AES256 encryption, all public access blocked). Provide a name to reuse an existing bucket you already manage.'

Conditions:
  # Blank means create a fresh bucket; non-blank means reuse the passed-in one.
  CreateBackupBucket: !Equals [!Ref S3BackupBucket, '']

Resources:
  # S3 bucket for records Firehose couldn't deliver. Only created when the
  # user leaves S3BackupBucket blank.
  BackupBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBackupBucket
    Properties:
      # No BucketName — CFN auto-generates, guaranteeing uniqueness.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Firehose does not auto-create the log group it delivers errors to — if
  # missing, delivery-error visibility is silently lost. Create it explicitly
  # and stack-scope the name so multiple stacks in the same region don't
  # conflict on it.
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/${AWS::StackName}"
      RetentionInDays: 14

  # Pre-create the log stream Firehose targets so the CloudWatch Logs console
  # can open it immediately after CREATE_COMPLETE, even before Firehose has
  # anything to write. Otherwise clicking "View error logs" shows "The
  # specified log stream does not exist" until Firehose lazily creates it.
  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: DeliveryStreamLogs

  # IAM Role for CloudWatch Metrics Stream
  # No explicit RoleName — as a nested stack under aws_complete, the parent
  # stack name is long enough that "PrefixRoleName-${AWS::StackName}-${AWS::Region}"
  # exceeds the IAM 64-char limit. Let CFN auto-generate the name.
  MetricsStreamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: streams.metrics.cloudwatch.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MetricsStreamPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/${KinesisFirehose}"

  # IAM Role for Kinesis Firehose
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehoseAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !If [CreateBackupBucket, !GetAtt BackupBucket.Arn, !Sub "arn:aws:s3:::${S3BackupBucket}"]
                  - !If [CreateBackupBucket, !Sub "${BackupBucket.Arn}/*", !Sub "arn:aws:s3:::${S3BackupBucket}/*"]
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                Resource: "*"

  # CloudWatch Metrics Stream
  MetricsStream:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: !Sub "MetricsStream-${AWS::StackName}"
      FirehoseArn: !GetAtt KinesisFirehose.Arn
      RoleArn: !GetAtt MetricsStreamRole.Arn
#      IncludeFilters:
#        - Namespace: "AWS/*"
      OutputFormat: opentelemetry1.0

  # Kinesis Firehose Delivery Stream
  KinesisFirehose:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      HttpEndpointDestinationConfiguration:
        EndpointConfiguration:
          Url: !Ref HttpEndpointUrl
          Name: !Ref HttpEndpointName
          AccessKey: !Ref AccessKey
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        RetryOptions:
          DurationInSeconds: 300
        S3BackupMode: FailedDataOnly
        S3Configuration:
          RoleARN: !GetAtt FirehoseRole.Arn
          BucketARN: !If [CreateBackupBucket, !GetAtt BackupBucket.Arn, !Sub "arn:aws:s3:::${S3BackupBucket}"]
          Prefix: OpenObserve_Metrics/
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream
        RoleARN: !GetAtt FirehoseRole.Arn

Outputs:
  MetricsStreamName:
    Description: Name of the CloudWatch Metrics Stream.
    Value: !Ref MetricsStream
  KinesisFirehoseName:
    Description: Name of the Kinesis Firehose.
    Value: !Ref KinesisFirehose
  BackupBucketName:
    Description: Name of the backup bucket being used (auto-generated if input was blank).
    Value: !If [CreateBackupBucket, !Ref BackupBucket, !Ref S3BackupBucket]
  WhereToFindData:
    Description: Where the CloudWatch metrics land in OpenObserve.
    Value: "OpenObserve UI -> Logs -> stream 'cloudwatch_metrics' (the /aws/.../cloudwatch_metrics/_kinesis_firehose ingester writes to a Logs-type stream with that fixed name). Query with SQL, e.g. SELECT namespace, metric_name, value FROM cloudwatch_metrics WHERE namespace = 'AWS/EC2'."
