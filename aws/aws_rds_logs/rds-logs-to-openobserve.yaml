  HasLogGroup10:  !Not [!Equals [!Select [9, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup11:  !Not [!Equals [!Select [10, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup12:  !Not [!Equals [!Select [11, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup13:  !Not [!Equals [!Select [12, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
