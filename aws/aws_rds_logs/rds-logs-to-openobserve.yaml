AWSTemplateFormatVersion: '2010-09-09'
Description: 'RDS Logs to OpenObserve via CloudWatch Logs, Kinesis Data Streams and Firehose'

Parameters:
  OpenObserveEndpoint:
    Type: String
    Description: 'OpenObserve HTTP endpoint URL (e.g., https://api.openobserve.ai/api/your-org/default/_kinesis)'

  OpenObserveAccessKey:
    Type: String
    NoEcho: true
    Description: 'OpenObserve access key for authentication (base64 encoded user:password)'

  StreamName:
    Type: String
    Default: 'rds-logs'
    Description: 'Name for the OpenObserve stream'

  LogGroupNames:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_./#-]+(,[A-Za-z0-9_./#-]+){0,49}$'
    ConstraintDescription: 'Between 1 and 50 log group names, comma separated, no spaces'
    Description: 'RDS CloudWatch Log Group names to stream. Up to 50, comma separated with no spaces (e.g., /aws/rds/instance/db-a/error,/aws/rds/instance/db-a/slowquery).'

  ShardCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: 'Number of shards for Kinesis Data Stream'

  BackupS3BucketName:
    Type: String
    Description: 'S3 bucket name for failed records backup (must be globally unique)'

  FilterPattern:
    Type: String
    Default: ''
    Description: 'CloudWatch Logs filter pattern (leave empty to stream all logs)'

  RDSInstanceIdentifier:
    Type: String
    Default: ''
    Description: 'RDS instance identifier (optional, for tagging purposes)'

Conditions:
  # Pad LogGroupNames with 49 trailing commas, then split — !Select [i, ...]
  # returns "" for slots the user didn't fill. Slot 0 is always present
  # because AllowedPattern requires at least one entry.
  HasLogGroup2:   !Not [!Equals [!Select [1, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup3:   !Not [!Equals [!Select [2, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup4:   !Not [!Equals [!Select [3, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup5:   !Not [!Equals [!Select [4, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup6:   !Not [!Equals [!Select [5, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup7:   !Not [!Equals [!Select [6, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup8:   !Not [!Equals [!Select [7, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
