  HasLogGroup17:  !Not [!Equals [!Select [16, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
  HasLogGroup18:  !Not [!Equals [!Select [17, !Split [",", !Join [",", [!Ref LogGroupNames, ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"]]]], ""]]
